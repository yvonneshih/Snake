<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Snake</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        canvas {
            background-color: #111;
            border-radius: 8px;
            box-shadow: 0 4px 24px #0005;
        }
        #score, #gameOver {
            margin-top: 20px;
            font-size: 1.5em;
            text-align: center;
        }
        #gameOver {
            display: none;
            cursor: pointer;
            padding: 10px 20px;
            background: #b85c5c;
            border-radius: 6px;
        }
        .controls-wrapper { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .controls-row label {
            min-width: 40px;
            text-align: right;
        }
        .controls-row input[type=range] {
            width: 80px;
        }
        .controls-row select {
            min-width: 80px;
        }
        .controls-row span {
            min-width: 36px;
            display: inline-block;
            text-align: center;
        }
        .lang-select {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <select class="lang-select" id="langSelect">
        <option value="en">English</option>
        <option value="zh">中文</option>
    </select>
    <h2 id="title">Gradient Snake</h2>
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div class="controls-wrapper">
        <div class="controls-row">
            <label id="shapeLabel">Shape</label>
            <select id="shapeSelect">
              <option value="round">Round</option>
              <option value="square">Square</option>
            </select>
            <label id="radiusLabel">Radius</label>
            <input type="range" id="radiusSlider" min="0" max="20" step="1" value="8">
            <span id="radiusVal">8</span>
            <label id="sizeLabel">Size</label>
            <input type="range" id="pixelSizeSlider" min="0.5" max="1" step="0.01" value="1">
            <span id="pixelSizeVal">1.00</span>
        </div>
        <div class="controls-row">
            <label id="speedLabel">Speed</label>
            <input type="range" id="speedSlider" min="1" max="10" step="1" value="5">
            <span id="speedVal">5</span>
        </div>
    </div>
    <div id="score">Score: 0</div>
    <div id="gameOver">
        <span id="gameOverText">Game Over! Click to Restart</span><br>
        <span id="finalScore"></span>
    </div>

    <script>
        const LANGS = {
            en: {
                title: "Gradient Snake",
                score: "Score",
                gameOverText: "Game Over! Click to Restart",
                finalScore: "Final Score",
                shapeLabel: "Shape",
                radiusLabel: "Radius",
                sizeLabel: "Size",
                speedLabel: "Speed",
                shapeRound: "Round",
                shapeSquare: "Square",
            },
            zh: {
                title: "渐变贪吃蛇",
                score: "分数",
                gameOverText: "游戏结束！点击重新开始",
                finalScore: "最终得分",
                shapeLabel: "形状",
                radiusLabel: "圆角",
                sizeLabel: "大小",
                speedLabel: "速度",
                shapeRound: "圆形",
                shapeSquare: "方形",
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const shapeSelect = document.getElementById('shapeSelect');
        const radiusSlider = document.getElementById('radiusSlider');
        const radiusVal = document.getElementById('radiusVal');
        const pixelSizeSlider = document.getElementById('pixelSizeSlider');
        const pixelSizeVal = document.getElementById('pixelSizeVal');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const langSelect = document.getElementById('langSelect');

        const gridSize = 8;
        const cellSize = canvas.width / gridSize;

        let snake, foods, score, direction, dx, dy, baseHue, gameOver;
        let pixelShape, cellRadius, pixelSizeRatio, gameSpeed;
        let roundHue;

        function setLanguage(lang) {
            const L = LANGS[lang];
            document.getElementById('title').textContent = L.title;
            document.getElementById('gameOverText').textContent = L.gameOverText;
            document.getElementById('shapeLabel').textContent = L.shapeLabel;
            document.getElementById('radiusLabel').textContent = L.radiusLabel;
            document.getElementById('sizeLabel').textContent = L.sizeLabel;
            document.getElementById('speedLabel').textContent = L.speedLabel;
            shapeSelect.querySelector('option[value="round"]').textContent = L.shapeRound;
            shapeSelect.querySelector('option[value="square"]').textContent = L.shapeSquare;
            scoreEl.textContent = `${L.score}: ${score}`;
        }

        function init() {
            snake = [{x: 4, y: 4, color: null}];
            foods = [];
            score = 0;
            direction = 'right';
            dx = 1;
            dy = 0;
            baseHue = Math.random() * 360;
            gameOver = false;
            roundHue = Math.random() * 360;
            
            setLanguage(langSelect.value);
            gameOverEl.style.display = 'none';
            
            placeFoods();
            gameLoop();
        }

        function setupVisuals() {
             // Shape controls
             pixelShape = 'round';
             cellRadius = 8;
             pixelSizeRatio = 1.0;
             gameSpeed = 150;

             shapeSelect.value = pixelShape;
             radiusSlider.value = cellRadius;
             radiusSlider.max = cellSize / 2;
             radiusVal.textContent = cellRadius;
             pixelSizeSlider.value = pixelSizeRatio;
             pixelSizeVal.textContent = pixelSizeRatio.toFixed(2);
             speedSlider.value = 5;
             speedVal.textContent = 5;
        }
        
        function placeFoods() {
            foods = [];
            const numFoods = 3;

            for (let i = 0; i < numFoods; i++) {
                let foodPlaced = false;
                let newFood;
                while (!foodPlaced) {
                    newFood = {
                        x: Math.floor(Math.random() * gridSize),
                        y: Math.floor(Math.random() * gridSize),
                        color: `hsl(${roundHue}, 90%, ${60 + i * 10}%)`
                    };
                    
                    const onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
                    const onOtherFood = foods.some(f => f.x === newFood.x && f.y === newFood.y);
                    
                    if (!onSnake && !onOtherFood) {
                        foodPlaced = true;
                    }
                }
                foods.push(newFood);
            }
        }

        function gameLoop() {
            if (gameOver) {
                finalScoreEl.textContent = `Final Score: ${score}`;
                gameOverEl.style.display = 'block';
                return;
            }

            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const head = {x: snake[0].x + dx, y: snake[0].y + dy, color: null};
                
                // Wall collision (wrap around)
                if (head.x < 0) head.x = gridSize - 1;
                if (head.x >= gridSize) head.x = 0;
                if (head.y < 0) head.y = gridSize - 1;
                if (head.y >= gridSize) head.y = 0;
                
                // Self collision
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver = true;
                    }
                }
                
                // Eat food
                let ateFood = false;
                let eatenFoodColor = null;
                for (let i = 0; i < foods.length; i++) {
                    if (head.x === foods[i].x && head.y === foods[i].y) {
                        score++;
                        scoreEl.textContent = `Score: ${score}`;
                        eatenFoodColor = foods[i].color;
                        placeFoods();
                        ateFood = true;
                        break;
                    }
                }
                
                const tail = snake.pop();
                snake.unshift(head);

                if (ateFood) {
                    tail.color = eatenFoodColor;
                    snake.push(tail);
                }
                
                draw();
                requestAnimationFrame(gameLoop);

            }, gameSpeed); 
        }

        function draw() {
            // Draw food
            foods.forEach(f => {
                ctx.fillStyle = f.color;
                const foodSize = cellSize * pixelSizeRatio;
                const foodOffset = (cellSize - foodSize) / 2;
                fillRoundRect(ctx, f.x * cellSize + foodOffset, f.y * cellSize + foodOffset, foodSize, foodSize, cellRadius);
            });

            // Draw snake
            baseHue += 1;
            snake.forEach((segment, index) => {
                if (segment.color) {
                    ctx.fillStyle = segment.color;
                } else {
                    const hue = (baseHue + index * 10) % 360;
                    ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
                }
                const segmentSize = cellSize * pixelSizeRatio;
                const segmentOffset = (cellSize - segmentSize) / 2;
                fillRoundRect(ctx, segment.x * cellSize + segmentOffset, segment.y * cellSize + segmentOffset, segmentSize, segmentSize, cellRadius);
            });
        }

        function fillRoundRect(ctx, x, y, w, h, r) {
            if (r <= 0 || pixelShape === 'square') {
                ctx.fillRect(x, y, w, h);
                return;
            }
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }
        
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (key === 'w' && direction !== 'down') { direction = 'up'; dx = 0; dy = -1; }
            if (key === 's' && direction !== 'up') { direction = 'down'; dx = 0; dy = 1; }
            if (key === 'a' && direction !== 'right') { direction = 'left'; dx = -1; dy = 0; }
            if (key === 'd' && direction !== 'left') { direction = 'right'; dx = 1; dy = 0; }
        });

        langSelect.onchange = (e) => {
            setLanguage(e.target.value);
        };
        shapeSelect.onchange = (e) => {
            pixelShape = e.target.value;
        };
        radiusSlider.oninput = function() {
            cellRadius = parseInt(this.value, 10);
            radiusVal.textContent = cellRadius;
        };
        pixelSizeSlider.oninput = function() {
            pixelSizeRatio = parseFloat(this.value);
            pixelSizeVal.textContent = pixelSizeRatio.toFixed(2);
        };
        speedSlider.oninput = function() {
            // Lower value on slider = faster speed = smaller timeout
            gameSpeed = 250 - (this.value * 20); 
            speedVal.textContent = this.value;
        };

        gameOverEl.addEventListener('click', init);

        setupVisuals();
        init();
    </script>
</body>
</html>
