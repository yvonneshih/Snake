<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Snake</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        canvas {
            background-color: #111;
            border-radius: 8px;
            box-shadow: 0 4px 24px #0005;
        }
        #score, #gameOver {
            margin-top: 20px;
            font-size: 1.5em;
            text-align: center;
        }
        #gameOver {
            display: none;
            cursor: pointer;
            padding: 10px 20px;
            background: #b85c5c;
            border-radius: 6px;
        }
        .controls-wrapper { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .controls-row label {
            min-width: 40px;
            text-align: right;
        }
        .controls-row input[type=range] {
            width: 80px;
        }
        .controls-row select {
            min-width: 80px;
        }
        .controls-row span {
            min-width: 36px;
            display: inline-block;
            text-align: center;
        }
        .game-buttons button {
            background: #b85c5c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 18px;
            font-size: 1em;
            margin: 0 6px;
            cursor: pointer;
        }
        .lang-select {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <select class="lang-select" id="langSelect">
        <option value="en">English</option>
        <option value="zh">中文</option>
    </select>
    <h2 id="title">Gradient Snake</h2>
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div class="controls-wrapper">
        <div class="controls-row">
            <label id="shapeLabel">Shape</label>
            <select id="shapeSelect">
              <option value="round">Round</option>
              <option value="square">Square</option>
            </select>
            <label id="radiusLabel">Radius</label>
            <input type="range" id="radiusSlider" min="0" max="20" step="1" value="8">
            <span id="radiusVal">8</span>
            <label id="sizeLabel">Size</label>
            <input type="range" id="pixelSizeSlider" min="0.5" max="1" step="0.01" value="1">
            <span id="pixelSizeVal">1.00</span>
        </div>
        <div class="controls-row">
            <label id="speedLabel">Speed</label>
            <input type="range" id="speedSlider" min="1" max="10" step="1" value="5">
            <span id="speedVal">5</span>
        </div>
        <div class="controls-row game-buttons">
            <button id="pauseBtn">Pause</button>
            <button id="playBtn">Play</button>
        </div>
    </div>
    <div id="score">Score: 0</div>
    <div id="missedCounter" style="margin-top: 5px; font-size: 1.2em;">Missed: 0</div>
    <div id="gameOver">
        <span id="gameOverText">Game Over! Click to Restart</span><br>
        <span id="finalScore"></span><br>
        <span id="finalMissed"></span>
    </div>

    <script>
        const LANGS = {
            en: {
                title: "Gradient Snake",
                score: "Score",
                gameOverText: "Game Over! Click to Restart",
                finalScore: "Final Score",
                shapeLabel: "Shape",
                radiusLabel: "Radius",
                sizeLabel: "Size",
                speedLabel: "Speed",
                shapeRound: "Round",
                shapeSquare: "Square",
                playBtn: "Play",
                pauseBtn: "Pause",
                missed: "Missed"
            },
            zh: {
                title: "渐变贪吃蛇",
                score: "分数",
                gameOverText: "游戏结束！点击重新开始",
                finalScore: "最终得分",
                shapeLabel: "形状",
                radiusLabel: "圆角",
                sizeLabel: "大小",
                speedLabel: "速度",
                shapeRound: "圆形",
                shapeSquare: "方形",
                playBtn: "播放",
                pauseBtn: "暂停",
                missed: "错过"
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const finalMissedEl = document.getElementById('finalMissed');
        const missedCounterEl = document.getElementById('missedCounter');
        const shapeSelect = document.getElementById('shapeSelect');
        const radiusSlider = document.getElementById('radiusSlider');
        const radiusVal = document.getElementById('radiusVal');
        const pixelSizeSlider = document.getElementById('pixelSizeSlider');
        const pixelSizeVal = document.getElementById('pixelSizeVal');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const langSelect = document.getElementById('langSelect');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        const gridSize = 8;
        const cellSize = canvas.width / gridSize;

        let snake, foods, score, direction, dx, dy, baseHue, gameOver, isPaused;
        let pixelShape, cellRadius, pixelSizeRatio, gameSpeed;
        let roundHue, missedFoods, missedFoodCount;

        function setLanguage(lang) {
            const L = LANGS[lang];
            document.getElementById('title').textContent = L.title;
            document.getElementById('gameOverText').textContent = L.gameOverText;
            document.getElementById('shapeLabel').textContent = L.shapeLabel;
            document.getElementById('radiusLabel').textContent = L.radiusLabel;
            document.getElementById('sizeLabel').textContent = L.sizeLabel;
            document.getElementById('speedLabel').textContent = L.speedLabel;
            shapeSelect.querySelector('option[value="round"]').textContent = L.shapeRound;
            shapeSelect.querySelector('option[value="square"]').textContent = L.shapeSquare;
            playBtn.textContent = L.playBtn;
            pauseBtn.textContent = L.pauseBtn;
            scoreEl.textContent = `${L.score}: ${score}`;
            missedCounterEl.textContent = `${L.missed}: ${missedFoodCount}`;
            if (gameOver) {
                finalScoreEl.textContent = `${L.finalScore}: ${score}`;
                finalMissedEl.textContent = `${L.missed}: ${missedFoodCount}`;
            }
        }

        function init() {
            snake = [{x: 4, y: 4, color: null}];
            foods = [];
            missedFoods = [];
            missedFoodCount = 0;
            score = 0;
            direction = 'right';
            dx = 1;
            dy = 0;
            baseHue = Math.random() * 360;
            gameOver = false;
            isPaused = false;
            roundHue = Math.random() * 360;
            
            setLanguage(langSelect.value);
            gameOverEl.style.display = 'none';
            
            placeFood();
            gameLoop();
        }

        function setupVisuals() {
             // Shape controls
             pixelShape = 'round';
             cellRadius = 8;
             pixelSizeRatio = 1.0;
             gameSpeed = 150;

             shapeSelect.value = pixelShape;
             radiusSlider.value = cellRadius;
             radiusSlider.max = cellSize / 2;
             radiusVal.textContent = cellRadius;
             pixelSizeSlider.value = pixelSizeRatio;
             pixelSizeVal.textContent = pixelSizeRatio.toFixed(2);
             speedSlider.value = 5;
             speedVal.textContent = 5;
        }
        
        function placeFood() {
            foods = [];
            const lifespan = 3000; // 3s
            const currentTime = performance.now();

            let foodPlaced = false;
            let newFood;
            while (!foodPlaced) {
                newFood = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize),
                    color: `hsl(${roundHue}, 90%, 70%)`,
                    disappearTime: currentTime + lifespan,
                };
                
                const onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
                if (!onSnake) {
                    foodPlaced = true;
                }
            }
            foods.push(newFood);
        }

        function gameLoop() {
            if (gameOver) {
                finalScoreEl.textContent = `${LANGS[langSelect.value].finalScore}: ${score}`;
                finalMissedEl.textContent = `${LANGS[langSelect.value].missed}: ${missedFoodCount}`;
                gameOverEl.style.display = 'block';
                return;
            }
            
            if (isPaused) {
                setTimeout(gameLoop, gameSpeed);
                return;
            }

            const gameLogic = () => {
                const currentTime = performance.now();
                
                const activeFoods = [];
                foods.forEach(f => {
                    if (f.disappearTime > currentTime) {
                        activeFoods.push(f);
                    } else {
                        missedFoodCount++;
                        missedFoods.push({
                            x: f.x,
                            y: f.y,
                            disappearTime: currentTime + 1000 // Show for 1 sec
                        });
                    }
                });
                foods = activeFoods;
                missedFoods = missedFoods.filter(mf => mf.disappearTime > currentTime);

                setLanguage(langSelect.value); // Update score/missed text

                if (foods.length === 0 && !gameOver) {
                    roundHue = (roundHue + 40) % 360;
                    placeFood();
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const head = {x: snake[0].x + dx, y: snake[0].y + dy, color: null};
                
                // Wall collision (wrap around)
                if (head.x < 0) head.x = gridSize - 1;
                if (head.x >= gridSize) head.x = 0;
                if (head.y < 0) head.y = gridSize - 1;
                if (head.y >= gridSize) head.y = 0;
                
                // Self collision
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver = true;
                        break;
                    }
                }
                if (gameOver) return;
                
                snake.unshift(head);

                let ateFood = false;
                foods.forEach((food, index) => {
                    if (head.x === food.x && head.y === food.y) {
                        ateFood = true;
                        foods.splice(index, 1);
                        score++;
                        scoreEl.textContent = `${LANGS[langSelect.value].score}: ${score}`;

                        const newSegmentColor = food.color;
                        snake[snake.length -1].color = newSegmentColor;
                        
                        roundHue = (roundHue + 40) % 360;
                        placeFood();
                    }
                });

                if (!ateFood) {
                    snake.pop();
                }
                
                draw();
            };
            
            gameLogic();

            if (!gameOver) {
                setTimeout(gameLoop, gameSpeed);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw missed foods
            missedFoods.forEach(mf => {
                drawCell(mf.x, mf.y, 'rgba(128, 128, 128, 0.4)');
            });

            // Draw food with blinking effect
            const currentTime = performance.now();
            foods.forEach(f => {
                const remainingTime = f.disappearTime - currentTime;
                const blink = remainingTime < 1500 && Math.floor(remainingTime / 250) % 2 === 0;
                if (!blink) {
                    drawCell(f.x, f.y, f.color);
                }
            });

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                let color;
                if (segment.color) {
                    color = segment.color;
                } else {
                    const hue = (baseHue + i * 5) % 360;
                    const saturation = 90 - (i * 2);
                    const lightness = 60 - (i * 1);
                    color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                }
                drawCell(segment.x, segment.y, color);
            }
        }

        function drawCell(x, y, color) {
            const size = cellSize * pixelSizeRatio;
            const gap = cellSize * (1 - pixelSizeRatio);
            const px = x * cellSize + gap / 2;
            const py = y * cellSize + gap / 2;
            
            ctx.fillStyle = color;
            if (pixelShape === 'square') {
                ctx.fillRect(px, py, size, size);
            } else {
                fillRoundRect(ctx, px, py, size, size, cellRadius);
            }
        }
        
        function fillRoundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fill();
        }

        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            let newDx = dx, newDy = dy;

            if ((key === 'w' || key === 'arrowup') && direction !== 'down') {
                newDx = 0; newDy = -1; direction = 'up';
            } else if ((key === 's' || key === 'arrowdown') && direction !== 'up') {
                newDx = 0; newDy = 1; direction = 'down';
            } else if ((key === 'a' || key === 'arrowleft') && direction !== 'right') {
                newDx = -1; newDy = 0; direction = 'left';
            } else if ((key === 'd' || key === 'arrowright') && direction !== 'left') {
                newDx = 1; newDy = 0; direction = 'right';
            }

            // Prevent the snake from reversing onto itself in the same game tick
            if (snake.length > 1) {
                const nextX = snake[0].x + newDx;
                const nextY = snake[0].y + newDy;
                if (nextX === snake[1].x && nextY === snake[1].y) {
                    return; // Ignore input that would cause immediate reversal
                }
            }
            dx = newDx;
            dy = newDy;
        });

        langSelect.addEventListener('change', (e) => setLanguage(e.target.value));
        
        shapeSelect.onchange = (e) => {
            pixelShape = e.target.value;
            draw();
        };
        radiusSlider.oninput = function() {
            cellRadius = parseInt(this.value, 10);
            radiusVal.textContent = cellRadius;
            draw();
        };
        pixelSizeSlider.oninput = function() {
            pixelSizeRatio = parseFloat(this.value);
            pixelSizeVal.textContent = pixelSizeRatio.toFixed(2);
            draw();
        };
        speedSlider.oninput = function() {
            // Lower value on slider = faster speed = smaller timeout
            gameSpeed = 250 - (this.value * 20); 
            speedVal.textContent = this.value;
            draw();
        };

        playBtn.onclick = () => {
            if (isPaused) {
                isPaused = false;
            }
        };

        pauseBtn.onclick = () => {
            isPaused = true;
        };

        gameOverEl.addEventListener('click', init);

        setupVisuals();
        init();
    </script>
</body>
</html>
